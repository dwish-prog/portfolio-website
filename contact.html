        <main>
            <article>
                <h1>Contact</h1>
                <p>Get in touch for collaborations.</p>
            </article>
            <section class="card-gallery-bg">
                <section class="card-gallery">
                    <form action="./submit_page" method="get" class="card">
                        <p>
                            <label for="name">Name (required): </label
                            ><input
                                type="text"
                                name="name"
                                id="name"
                                required />
                        </p>
                        <p>
                            <label for="subject">Subject: </label
                            ><select name="subject" id="subject" required>
                                <option value="">--Choose an option--</option>
                                <option value="data">Data Analysis</option>
                                <option value="dev">
                                    Software Development
                                </option>
                                <option value="coaching">Coaching</option>
                                <option value="piano">
                                    Piano Accompaniment
                                </option>
                                <option value="teaching">
                                    Piano or Musicianship Lessons
                                </option>
                                <option value="sheet music">
                                    Arranging & Transcription
                                </option>
                                <option value="composing">Composing</option>
                                <option value="other">Other</option>
                            </select>
                        </p>
                        <p>
                            <label for="email">Email (required): </label
                            ><input
                                type="email"
                                name="email"
                                id="email"
                                required />
                        </p>
                        <p>
                            <label for="message">Your message: </label>
                            <textarea id="message" name="message"></textarea>
                        </p>
                        <p>
                            <button>Submit</button>
                        </p>
                    </form>
                </section>
            </section>
